version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend-verifikasidata:latest
    container_name: backend-verifikasidata
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # If using local SQLite database, uncomment the line below:
    # volumes:
    #   - ./sqlite.db:/usr/src/app/sqlite.db
